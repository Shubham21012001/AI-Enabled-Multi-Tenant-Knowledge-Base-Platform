# Local development infrastructure: PostgreSQL 16 + pgvector, and Redis 7.
# Start:  docker compose up -d
# Values come from ./.env (see .env.example); defaults are for local dev only.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowbot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-knowbot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowbot} -d ${POSTGRES_DB:-knowbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: knowbot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
