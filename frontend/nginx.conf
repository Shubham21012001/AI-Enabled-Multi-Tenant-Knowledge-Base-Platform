server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads are limited to 10 MB by the API; allow multipart overhead.
    client_max_body_size 12m;
    server_tokens off;

    # Caddy (on the private Docker network) is the only trusted proxy. It sets
    # X-Forwarded-For to the real client IP, so recover it here and forward
    # only that — the API's per-IP rate limits depend on it.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # API: strip the /api prefix and forward to FastAPI.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Server-Sent Events: stream tokens immediately, never buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Hashed static assets can be cached forever.
    # (No add_header inside locations: in nginx that would drop every
    # server-level security header above for that location.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: React Router handles the path.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
